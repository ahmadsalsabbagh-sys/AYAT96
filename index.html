<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASO - Wear Your Personality</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
    body{
      background: linear-gradient(270deg, #b56bd7, #8e44ad, #6a1b9a, #b56bd7);
      background-size: 800% 800%;
      animation: gradientShift 15s ease infinite;
      overflow:hidden;
      color:white;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    header{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      text-align:center;z-index:10;
    }
    h1{font-size:4rem;letter-spacing:5px;text-transform:uppercase;font-weight:900;}
    h2{font-size:1.8rem;margin-top:10px;font-weight:400;opacity:.9;}
    .slogan{
      margin-top:30px;font-size:1.3rem;background:rgba(255,255,255,0.15);
      padding:12px 20px;border-radius:20px;backdrop-filter:blur(10px);
      display:inline-block;
    }
    .phone{
      margin-top:40px;font-size:1.3rem;font-weight:700;
      background:rgba(255,255,255,0.15);padding:15px 30px;border-radius:50px;
      display:flex;align-items:center;gap:10px;cursor:pointer;
      transition:0.3s;backdrop-filter:blur(10px);justify-content:center;
    }
    .phone:hover{background:rgba(255,255,255,0.3);transform:scale(1.05);}
    .phone svg{width:24px;height:24px;fill:white;opacity:0.8;}
    canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <header>
    <h1>ASO</h1>
    <h2>Wear Your Personality</h2>
    <div class="slogan">✨ الفكرة أنك ترتدي بذكاء ✨</div>
    <div class="phone">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 
                 011.11-.21c1.21.49 2.53.76 3.91.76a1 1 0 
                 011 1V21a1 1 0 01-1 1C10.07 22 2 13.93 2 
                 3a1 1 0 011-1h3.5a1 1 0 011 1c0 
                 1.38.26 2.7.76 3.91a1 1 0 
                 01-.21 1.11l-2.43 2.43z"/>
      </svg>
      0796030016
    </div>
  </header>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({canvas: document.getElementById("bg"), antialias:true, alpha:true});
    renderer.setSize(window.innerWidth, window.innerHeight);

    // إضاءة
    const light = new THREE.DirectionalLight(0xffffff,1.2);
    light.position.set(10,10,10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff,0.5));

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    camera.position.z = 10;

    // تحميل موديل جاكيت/تي-شيرت
    const loader = new THREE.GLTFLoader();
    loader.load(
      "https://threejs.org/examples/models/gltf/Flamingo.glb", // استبدلي برابط GLB للملابس
      function(gltf){
        const model = gltf.scene;
        model.scale.set(2.5,2.5,2.5);
        model.position.y = -2;
        scene.add(model);

        // إنشاء particles حول الموديل
        const particleCount = 200;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesMaterial = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.05,
          transparent:true,
          opacity:0.7
        });
        const positions = [];
        for(let i=0;i<particleCount;i++){
          positions.push(
            (Math.random()-0.5)*6,
            (Math.random()-0.5)*6,
            (Math.random()-0.5)*6
          );
        }
        particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        function animateParticles(time){
          const pos = particlesGeometry.attributes.position.array;
          for(let i=0;i<pos.length;i+=3){
            pos[i+1] += Math.sin(time*0.001 + i)*0.002;
            if(pos[i+1] > 3) pos[i+1] = -3;
          }
          particlesGeometry.attributes.position.needsUpdate = true;
        }

        function animate(time){
          requestAnimationFrame(animate);
          model.rotation.y += 0.005;
          animateParticles(time);
          controls.update();
          renderer.render(scene,camera);
        }
        animate(0);
      },
      undefined,
      function(error){console.error("خطأ بتحميل الموديل:",error);}
    );

    window.addEventListener("resize", ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
